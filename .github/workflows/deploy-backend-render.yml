name: Backend CI/CD & Docker Build

on:
  push:
    branches:
      - main
      - master
      - Preview
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  test-and-lint:
    name: Backend System Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Check
        run: |
          python manage.py check --settings=config.settings.production

  build-and-push-docker:
    name: Build & Push Docker Image to GHCR
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-render:
    name: Trigger Render Deployment
    needs: build-and-push-docker
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          DEPLOY_URL="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://api.render.com/deploy/srv-d9qaabid0e5s739a1b7g?key=wPwfhdM7qQ8"
            echo "Using default Render deploy hook URL."
          else
            echo "Using RENDER_DEPLOY_HOOK_URL secret."
          fi
          
          echo "Triggering Render deployment..."
          response=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_URL")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Successfully triggered Render deployment! (HTTP $http_code)"
            echo "Response: $body"
          else
            echo "Failed to trigger Render deployment! (HTTP $http_code)"
            echo "Response: $body"
            exit 1
          fi
