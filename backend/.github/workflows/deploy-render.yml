name: Deploy Backend to Render (CI/CD)

on:
  push:
    branches:
      - main
      - master
      - Preview
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Run Backend Tests & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Check
        run: |
          python manage.py check --settings=config.settings.production

      - name: Run Unit Tests
        run: |
          python manage.py test --settings=config.settings.test

  deploy-to-render:
    name: Trigger Render Deployment
    needs: test-and-verify
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render via Deploy Hook
        run: |
          DEPLOY_URL="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://api.render.com/deploy/srv-d9qaabid0e5s739a1b7g?key=wPwfhdM7qQ8"
            echo "Using default Render deploy hook URL."
          else
            echo "Using RENDER_DEPLOY_HOOK_URL secret."
          fi
          
          echo "Triggering Render deployment..."
          response=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_URL")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Successfully triggered Render deployment! (HTTP $http_code)"
            echo "Response: $body"
          else
            echo "Failed to trigger Render deployment! (HTTP $http_code)"
            echo "Response: $body"
            exit 1
          fi
