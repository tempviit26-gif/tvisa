                                <input type="email" placeholder="Email Address" className="w-full border-0 border-b border-primary bg-transparent py-4 focus:ring-0 focus:border-secondary transition-colors mb-4" />
                            </section>
                            <section>
                                <h2 className="font-display text-2xl mb-8">Shipping Address</h2>
                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    <input type="text" placeholder="First Name" className="w-full border-0 border-b border-primary bg-transparent py-4 focus:ring-0" />
                                    <input type="text" placeholder="Last Name" className="w-full border-0 border-b border-primary bg-transparent py-4 focus:ring-0" />
                                </div>
                                <input type="text" placeholder="Address" className="w-full border-0 border-b border-primary bg-transparent py-4 focus:ring-0 mb-4" />
                            </section>
                            <button onClick={() => navigate('/')} className="w-full py-4 bg-secondary text-white uppercase tracking-widest">Complete Purchase</button>
                        </div>
                        <div className="lg:w-5/12 bg-surface-container-low p-8 border border-outline/10 h-fit">
                            <h2 className="font-display text-xl mb-6">Summary</h2>
                            <div className="flex justify-between items-center mb-6">
                                <div className="flex gap-4">
                                    <div className="w-12 h-16 bg-surface-container"></div>
                                    <div><p className="text-xs font-bold uppercase">Lumina Pendant</p><p className="text-[10px] text-outline">Qty: 1</p></div>
                                </div>
                                <span className="text-sm">$1,250</span>
                            </div>
                            <div className="border-t border-outline/10 pt-4 flex justify-between font-display text-2xl">
                                <span>Total</span>
                                <span>$1,250</span>
                            </div>
                        </div>
                    </main>
                    <footer className="text-center py-8 text-[10px] text-outline uppercase tracking-widest border-t border-outline/10">© 2024 Tvisaa. Secure Checkout.</footer>
                </div>
            );
        };

        const LoginPage = () => {
            const navigate = useNavigate();
            return (
                <div className="flex flex-col min-h-screen items-center justify-center bg-surface-container-low px-margin-mobile">
                    <Link to="/" className="font-display text-4xl mb-12">Tvisaa</Link>
                    <div className="w-full max-w-[400px] flex flex-col gap-10">
                        <div className="text-center">
                            <h1 className="font-display text-3xl mb-2">Sign In</h1>
                            <p className="text-on-surface-variant">Enter your details to access your atelier.</p>
                        </div>
                        <form className="flex flex-col gap-6" onSubmit={(e) => { e.preventDefault(); navigate('/'); }}>
                            <input type="email" placeholder="EMAIL ADDRESS" className="w-full bg-transparent border-0 border-b border-outline py-2 text-sm focus:ring-0 focus:border-primary transition-colors" required />
                            <div className="relative">
                                <input type="password" placeholder="PASSWORD" className="w-full bg-transparent border-0 border-b border-outline py-2 text-sm focus:ring-0 focus:border-primary transition-colors" required />
                                <button type="button" className="absolute right-0 bottom-2 text-outline"><span className="material-symbols-outlined text-lg">visibility_off</span></button>
                            </div>
                            <button className="w-full py-4 border border-primary uppercase tracking-widest text-xs hover:bg-primary hover:text-white transition-all mt-4">Sign In</button>
                        </form>
                        <div className="flex items-center gap-4">
                            <div className="h-px bg-outline/20 flex-grow"></div>
                            <span className="text-[10px] text-outline uppercase">OR</span>
                            <div className="h-px bg-outline/20 flex-grow"></div>
                        </div>
                        <Link to="/register" className="w-full py-4 border border-outline/30 uppercase tracking-widest text-xs text-center hover:border-primary transition-colors">Create Account</Link>
                    </div>
                </div>
            );
        };

        const RegisterPage = () => {
            const navigate = useNavigate();
            return (
                <div className="flex flex-col min-h-screen pt-20">
                    <TopNavBar suppressed />
                    <main className="flex-grow flex items-center justify-center px-6 py-stack-lg">
                        <div className="w-full max-w-[400px] flex flex-col gap-10">
                            <div className="text-center">
                                <h1 className="font-display text-3xl mb-2">Create Account</h1>
                                <p className="text-on-surface-variant">Join Tvisaa to explore bespoke craftsmanship.</p>
                            </div>
                            <form className="flex flex-col gap-6" onSubmit={(e) => { e.preventDefault(); navigate('/'); }}>
                                <div className="grid grid-cols-2 gap-4">
                                    <input type="text" placeholder="FIRST NAME" className="w-full bg-transparent border-0 border-b border-outline py-2 text-sm focus:ring-0 focus:border-primary" required />
                                    <input type="text" placeholder="LAST NAME" className="w-full bg-transparent border-0 border-b border-outline py-2 text-sm focus:ring-0 focus:border-primary" required />
                                </div>
                                <input type="email" placeholder="EMAIL ADDRESS" className="w-full bg-transparent border-0 border-b border-outline py-2 text-sm focus:ring-0 focus:border-primary" required />
                                <input type="password" placeholder="PASSWORD" className="w-full bg-transparent border-0 border-b border-outline py-2 text-sm focus:ring-0 focus:border-primary" required />
                                <label className="flex items-start gap-3 cursor-pointer">
                                    <input type="checkbox" className="mt-1 border-outline bg-transparent" />
                                    <span className="text-xs text-on-surface-variant">Subscribe to receive exclusive insights and bespoke offers.</span>
                                </label>
                                <button className="w-full py-4 border border-primary uppercase tracking-widest text-xs flex justify-center items-center gap-2 hover:bg-secondary hover:text-white transition-all">
                                    Create Account
                                    <span className="material-symbols-outlined text-sm">arrow_forward</span>
                                </button>
                            </form>
                            <p className="text-center text-xs text-on-surface-variant">
                                Already have an account? <Link to="/login" className="underline font-bold">Sign In</Link>
                            </p>
                        </div>
                    </main>
                    <Footer />
                </div>
            );
        };

        // --- App Shell ---

        const ScrollToTop = () => {
            const { pathname } = useLocation();
            useEffect(() => { window.scrollTo(0, 0); }, [pathname]);
            return null;
        };

        const App = () => {
            return (
                <MemoryRouter>
                    <ScrollToTop />
                    <Routes>
                        <Route path="/" element={<HomePage />} />
                        <Route path="/collections" element={<CollectionsPage />} />
                        <Route path="/product/:id" element={<ProductPage />} />
                        <Route path="/cart" element={<CartPage />} />
                        <Route path="/checkout" element={<CheckoutPage />} />
                        <Route path="/login" element={<LoginPage />} />
                        <Route path="/register" element={<RegisterPage />} />
                    </Routes>
                </MemoryRouter>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
